name: File size
description: Fails when a file matching the globs has more lines than the budget; current offenders sit in an allowlist whose numbers may only shrink.
inputs:
  globs:
    description: Files to check, one glob per line; a line starting with ! excludes. Paths are relative to the repository root.
    required: true
  max-lines:
    description: The most lines a file may have.
    required: true
  allowlist:
    description: 'JSON file of files already over the budget, { "path": current lines }. Empty for none.'
    default: ''
runs:
  using: composite
  steps:
    - name: Check file sizes
      shell: bash
      env:
        GLOBS: ${{ inputs.globs }}
        MAX_LINES: ${{ inputs.max-lines }}
        ALLOWLIST: ${{ inputs.allowlist }}
      # The globs go as one argument; the script splits it into lines.
      run: node "$GITHUB_ACTION_PATH/file-size.mjs" --max-lines "$MAX_LINES" ${ALLOWLIST:+--allowlist "$ALLOWLIST"} "$GLOBS"
