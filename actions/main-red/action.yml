name: Main red
description: Opens one issue per workflow when its push run on the default branch fails, comments while it keeps failing, and closes it when the workflow passes there again.
inputs:
  label:
    description: The label the issues get and are found by.
    default: main-red
  token:
    description: Token with issues write permission.
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - name: Open, update or close the issue
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        LABEL: ${{ inputs.label }}
        WORKFLOW_RUN: ${{ toJSON(github.event.workflow_run) }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: node "$GITHUB_ACTION_PATH/main-red.mjs"
